name: urbansync

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile

    container_name: urbansync-api

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__UrbanSyncDb: ${URBANSYNC_DB_CONNECTION}

      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}

      Cors__AllowedOrigins__0: http://localhost:8081

    ports:
      - "8080:8080"

    networks:
      - urbansync-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8080/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile

    container_name: urbansync-web

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      UrbanSyncApi__BaseUrl: http://api:8080/

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "8081:8080"

    networks:
      - urbansync-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8080/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  urbansync-network:
    driver: bridge